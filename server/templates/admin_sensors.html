<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoren - Waschmaschinen-Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav class="nav-bar"><a href="/" class="back-link">Zur Übersicht</a></nav>
        <h1>Sensoren</h1>
    </header>
    <main class="admin-main">
        <table class="sensor-table">
            <thead>
                <tr><th>BLE-ID</th><th>Letzter Aggregator</th><th>Letzter Tastendruck</th><th>Typ</th><th>Nummer</th><th>Aktion</th></tr>
            </thead>
            <tbody>
            {% for sensor in sensors %}
                <tr data-aggregator-name="{{ sensor.last_aggregator_name or '' }}">
                    <td><code>{{ sensor.sensor_id }}</code></td>
                    <td>{{ sensor.last_aggregator_name or '-' }}</td>
                    <td>{{ format_timestamp(sensor.last_assignment_flag_at) }}</td>
                    <td>
                        <select class="assignment-type" data-sensor-id="{{ sensor.sensor_id }}" aria-label="Gerätetyp">
                            <option value="1" {% if sensor.machine_type == 1 %}selected{% endif %}>Waschmaschine</option>
                            <option value="2" {% if sensor.machine_type == 2 %}selected{% endif %}>Tumbler</option>
                        </select>
                    </td>
                    <td>
                        <input class="assignment-machine" data-sensor-id="{{ sensor.sensor_id }}" type="number" min="1" required aria-label="Maschinennummer" value="{{ sensor.machine_id or '' }}">
                    </td>
                    <td><button class="assign-sensor" data-sensor-id="{{ sensor.sensor_id }}">Speichern</button></td>
                </tr>
            {% else %}
                <tr><td colspan="6">Noch keine Sensoren empfangen.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </main>
    <script>
        document.querySelectorAll('.assign-sensor').forEach((button) => {
            button.addEventListener('click', async () => {
                const sensorId = button.dataset.sensorId;
                const row = button.closest('tr');
                const aggregatorName = row.dataset.aggregatorName;
                const machineType = row.querySelector('.assignment-type').value;
                const machineId = row.querySelector('.assignment-machine').value;
                if (!aggregatorName || !machineId) {
                    alert('Letzter Aggregator und Nummer sind erforderlich.');
                    return;
                }
                const response = await fetch(`/api/admin/sensors/${sensorId}/assignment`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({aggregator_name: aggregatorName, machine_type: machineType, machine_id: machineId})
                });
                if (!response.ok) alert(await response.text());
                else window.location.reload();
            });
        });
    </script>
</body>
</html>
